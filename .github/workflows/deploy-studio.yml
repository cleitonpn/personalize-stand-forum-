name: Deploy Studio (Firebase Hosting)

# O protótipo do Fórum continua indo para o GitHub Pages pelo deploy.yml.
# Este workflow cuida só do app novo em studio/.
on:
  push:
    branches:
      - claude/stand-personalizacao-brainstorm-075ofg
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: personalizacao-stand
          channelId: live
          entryPoint: studio

      # A action acima publica só o site. Regras e functions precisam da CLI —
      # e sem isto elas nunca chegariam ao Firebase, porque dependeriam de
      # alguém rodar comando na mão.
      - name: Credencial da conta de serviço
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Cada alvo vai num passo próprio e tolerante a falha. Publicar tudo junto
      # fazia uma permissão faltante no Storage derrubar também as regras do
      # Firestore, que são as que governam quem lê e escreve o quê.
      - name: Publicar regras do Firestore
        id: firestore
        continue-on-error: true
        run: npx --yes firebase-tools@13 deploy
          --only firestore:rules
          --project personalizacao-stand
          --non-interactive

      - name: Publicar regras do Storage
        id: storage
        continue-on-error: true
        run: npx --yes firebase-tools@13 deploy
          --only storage
          --project personalizacao-stand
          --non-interactive

      # A CLI carrega functions/index.js na própria máquina para descobrir quais
      # gatilhos existem. Sem as dependências instaladas aqui, esse require
      # falha em "Cannot find module 'firebase-functions/v2/https'" antes mesmo
      # de tentar publicar — o build no servidor não chega a acontecer.
      - name: Instalar dependências das functions
        working-directory: studio/functions
        continue-on-error: true
        run: npm ci

      # Functions exigem o plano Blaze. Num projeto no plano gratuito este passo
      # falha, e isso não pode derrubar o resto — o app foi feito para funcionar
      # sem elas.
      - name: Publicar Cloud Functions (requer plano Blaze)
        id: functions
        continue-on-error: true
        run: npx --yes firebase-tools@13 deploy
          --only functions
          --project personalizacao-stand
          --non-interactive

      - name: O que foi publicado
        run: |
          echo "### Publicação no Firebase" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Alvo | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site (Hosting) | publicado |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regras do Firestore | ${{ steps.firestore.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Regras do Storage | ${{ steps.storage.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloud Functions | ${{ steps.functions.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

          FALTA="A conta de serviço precisa do papel Editor (ou, no mínimo, Service Usage Consumer + Firebase Rules Admin) no IAM do projeto: console.cloud.google.com/iam-admin/iam"

          if [ "${{ steps.firestore.outcome }}" != "success" ]; then
            echo "::warning::Regras do Firestore NÃO publicadas — o app está rodando com as regras antigas. $FALTA"
          fi
          if [ "${{ steps.storage.outcome }}" != "success" ]; then
            echo "::warning::Regras do Storage NÃO publicadas. $FALTA"
          fi
          if [ "${{ steps.functions.outcome }}" != "success" ]; then
            echo "::warning::Cloud Functions não publicadas. O app funciona sem elas — só a exclusão do login do expositor fica pela metade. Veja o log do passo: se falou em plano de faturamento, o projeto precisa estar no Blaze; se falou em módulo não encontrado, o passo de instalar dependências não rodou."
          fi
