name: Deploy Studio (Firebase Hosting)

# O protótipo do Fórum continua indo para o GitHub Pages pelo deploy.yml.
# Este workflow cuida só do app novo em studio/.
on:
  push:
    branches:
      - claude/stand-personalizacao-brainstorm-075ofg
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: personalizacao-stand
          channelId: live
          entryPoint: studio

      # A action acima publica só o site. Regras e functions precisam da CLI —
      # e sem isto elas nunca chegariam ao Firebase, porque dependeriam de
      # alguém rodar comando na mão.
      - name: Credencial da conta de serviço
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Publicar regras do Firestore e do Storage
        run: npx --yes firebase-tools@13 deploy
          --only firestore:rules,storage
          --project personalizacao-stand
          --non-interactive

      # Functions exigem o plano Blaze. Num projeto no plano gratuito este passo
      # falha, e isso não pode derrubar o deploy do site nem das regras — o app
      # foi feito para funcionar sem elas.
      - name: Publicar Cloud Functions (requer plano Blaze)
        id: functions
        continue-on-error: true
        run: npx --yes firebase-tools@13 deploy
          --only functions
          --project personalizacao-stand
          --non-interactive

      - name: Aviso sobre as functions
        if: steps.functions.outcome == 'failure'
        run: |
          echo "::warning::As Cloud Functions não foram publicadas. O app segue" \
               "funcionando sem elas — só a exclusão do login do expositor fica" \
               "pela metade. A causa mais comum é o projeto estar no plano" \
               "gratuito (Spark): Functions exigem o Blaze."
